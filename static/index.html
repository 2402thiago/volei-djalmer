<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vôlei Djalmer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topo">
    <h1>Vôlei Djalmer</h1>
    <div class="acoes-topo">
      <span id="indicador-sync" class="badge" title="Status da sincronização">…</span>
      <button id="btn-abrir-casais" class="icone-coracao" title="Gerenciar casais" aria-label="Gerenciar casais">&#9825;</button>
    </div>
  </header>

  <dialog id="popup-casais" class="popup-casais">
    <div class="cabecalho-popup">
      <h2>Casais</h2>
      <button id="btn-fechar-casais" class="fechar-popup" aria-label="Fechar">&times;</button>
    </div>
    <button id="btn-casais" class="secundario" aria-pressed="false">Casais: desativado</button>
    <p id="msg-casais" class="msg">Ative para manter os casais no mesmo time.</p>
    <div id="editor-casais" class="editor-casais"></div>
    <div class="adicionar-casal">
      <h3>Adicionar casal</h3>
      <input id="nome-casal-1" type="text" placeholder="Primeiro participante" maxlength="80" />
      <input id="nome-casal-2" type="text" placeholder="Segundo participante" maxlength="80" />
      <button id="btn-adicionar-casal" class="primario">Adicionar casal</button>
      <p id="msg-adicionar-casal" class="msg"></p>
    </div>
  </dialog>

  <!-- Navegação inferior -->
  <nav class="abas">
    <button data-tela="dashboard" class="aba ativa">Times</button>
    <button data-tela="participantes" class="aba">Participantes</button>
    <button data-tela="presenca" class="aba">Presença</button>
  </nav>

  <main>
    <!-- Tela 1: Dashboard / Times -->
    <section id="dashboard" class="tela ativa">
      <div class="card acao">
        <div class="linha linha-acoes">
          <button id="btn-montar" class="primario">Sortear times</button>
          <button id="btn-compartilhar-times" class="secundario">Compartilhar times</button>
        </div>
        <p id="msg-montar" class="msg"></p>
      </div>
      <div id="lista-times" class="grade"></div>
    </section>

    <!-- Tela 2: Participantes -->
    <section id="participantes" class="tela">
      <div class="card acao" id="importar-box">
        <label>Importar lista do WhatsApp (única forma de adicionar atletas)</label>
        <textarea id="whatsapp-texto" placeholder="Cole a mensagem do grupo aqui..." rows="8"></textarea>
        <div class="linha">
          <button id="btn-preview" class="secundario">Visualizar 24 titulares</button>
          <button id="btn-confirmar-importar" class="primario" style="display:none">Confirmar importação</button>
        </div>
        <div id="preview-importar" class="preview-lista" style="display:none"></div>
        <p id="msg-importar" class="msg"></p>
      </div>
      <div class="card acao dados-locais">
        <label>Compartilhamento</label>
        <div class="linha linha-acoes">
          <button id="btn-compartilhar" class="secundario">Compartilhar lista</button>
        </div>
        <p class="msg">A lista é mantida localmente neste navegador.</p>
      </div>
      <div class="card acao dados-locais">
        <label>Dados do site</label>
        <button id="btn-limpar-dados" class="perigo">Limpar todos os dados</button>
        <p id="msg-limpar-dados" class="msg"></p>
      </div>
      <div class="card resumo-participantes">
        <h2>Quantidade de atletas</h2>
        <div id="resumo-niveis" class="tabela-resumo"></div>
      </div>
      <div class="card acao filtros-participantes">
        <label>Filtrar por nível</label>
        <div id="atalhos-niveis" class="atalhos-niveis" aria-label="Filtrar por nível">
          <button type="button" class="atalho-nivel ativo" data-nivel="">Todos</button>
          <button type="button" class="atalho-nivel" data-nivel="C1">C1</button>
          <button type="button" class="atalho-nivel" data-nivel="M1">M1</button>
          <button type="button" class="atalho-nivel" data-nivel="M2">M2</button>
          <button type="button" class="atalho-nivel" data-nivel="F1">F1</button>
          <button type="button" class="atalho-nivel" data-nivel="F2">F2</button>
          <button type="button" class="atalho-nivel" data-nivel="LM1">LM1</button>
          <button type="button" class="atalho-nivel" data-nivel="LF1">LF1</button>
        </div>
        <label class="label-filtro-sexo">Filtrar por sexo</label>
        <div id="atalhos-sexos" class="atalhos-niveis" aria-label="Filtrar por sexo">
          <button type="button" class="atalho-sexo ativo" data-sexo="">Todos</button>
          <button type="button" class="atalho-sexo" data-sexo="F">F</button>
          <button type="button" class="atalho-sexo" data-sexo="M">M</button>
        </div>
        <p id="contador-filtros" class="msg"></p>
      </div>
      <div id="lista-participantes" class="lista"></div>
    </section>

    <section id="presenca" class="tela">
      <div class="card acao">
        <label>Lista de presença</label>
        <p class="msg">Confirme os atletas. Cada time completo recebe a próxima posição de entrada.</p>
      </div>
      <div id="lista-presenca" class="lista-presenca"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
