<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Vôlei Djalmer" />
  <title>Vôlei Djalmer</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main>
    <section id="tela-master" class="tela" aria-labelledby="aba-master" hidden></section>
    <section id="tela-lista" class="tela" aria-labelledby="aba-lista"></section>
    <section id="tela-times" class="tela" aria-labelledby="aba-times" hidden></section>
    <section id="tela-presenca" class="tela" aria-labelledby="aba-presenca" hidden></section>
  </main>

  <nav class="abas" aria-label="Telas">
    <button id="aba-master" class="aba" data-tela="master">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      <span>Lista Master</span>
    </button>
    <button id="aba-lista" class="aba" data-tela="lista" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5l2 2 3.5-4M3.5 16.5l2 2 3.5-4M12 8h8.5M12 17h8.5"/></svg>
      <span>Lista</span>
    </button>
    <button id="aba-times" class="aba" data-tela="times">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      <span>Times</span>
    </button>
    <button id="aba-presenca" class="aba" data-tela="presenca">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.2l2.7 2.7L16.2 9.4"/></svg>
      <span>Presença</span>
    </button>
  </nav>

  <dialog id="folha" class="folha" aria-labelledby="folha-titulo">
    <form method="dialog" class="folha-corpo">
      <header class="folha-topo">
        <button value="cancelar" class="botao-texto" id="folha-cancelar">Cancelar</button>
        <h2 id="folha-titulo"></h2>
        <button value="ok" class="botao-texto forte" id="folha-ok">OK</button>
      </header>
      <div id="folha-conteudo" class="folha-conteudo"></div>
    </form>
  </dialog>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
</body>
</html>
