# Blueprint de deploy do Render.
# Os valores secretos (GOOGLE_SERVICE_ACCOUNT_INFO e GOOGLE_SHEETS_ID) são
# definidos no painel do Render como variáveis de ambiente — não ficam aqui.
services:
  - type: web
    name: volei-djalmer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SYNC_INTERVAL_SECONDS
        value: "20"
      - key: APP_ENV
        value: production
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_INFO
        sync: false